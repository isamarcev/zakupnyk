  <!-- відкриті клапани коробки -->
  <polygon points="14,26 32,18 26,10 10,17" fill="#FFD700" opacity="0.85"/>
  <polygon points="50,26 32,18 38,10 54,17" fill="#FFD700" opacity="0.85"/>
  <!-- корпус коробки -->
  <rect x="14" y="26" width="36" height="26" rx="3" fill="#FFD700"/>
